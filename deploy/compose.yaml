# Local multi-replica setup: Caddy load-balances across three stateless AIRTRUTH instances sharing Redis.
#
#   docker compose -f deploy/compose.yaml up --build
#
# Optional secrets (GEMINI_API_KEY) go in deploy/.env (gitignored).

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: airtruth:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
    TRUSTED_PROXY_HOPS: "1"
    FORWARDED_ALLOW_IPS: "*"
    LOG_FORMAT: json
    # SITE_URL: https://airtruth.example
  expose: ["8080"]
  depends_on:
    redis:
      condition: service_healthy

services:
  app1:
    <<: *app
    hostname: app1
  app2:
    <<: *app
    hostname: app2
  app3:
    <<: *app
    hostname: app3

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    expose: ["6379"]

  caddy:
    image: caddy:2-alpine
    ports: ["8080:8080"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [app1, app2, app3]
